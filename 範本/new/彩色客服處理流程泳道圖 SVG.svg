<svg width="1100" height="850" viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg {
        fill: #F8FAFC;
      }

      .outer {
        fill: #FFFFFF;
        stroke: #1F2937;
        stroke-width: 2;
      }

      .title-row {
        fill: #E0F2FE;
        stroke: #1F2937;
        stroke-width: 1.6;
      }

      .lane-header {
        stroke: #1F2937;
        stroke-width: 1.5;
      }

      .lane-customer {
        fill: #FEF3C7;
      }

      .lane-service {
        fill: #DBEAFE;
      }

      .lane-tech {
        fill: #DCFCE7;
      }

      .lane-qa {
        fill: #F3E8FF;
      }

      .lane-bg-customer {
        fill: #FFFBEB;
      }

      .lane-bg-service {
        fill: #EFF6FF;
      }

      .lane-bg-tech {
        fill: #F0FDF4;
      }

      .lane-bg-qa {
        fill: #FAF5FF;
      }

      .lane-line {
        stroke: #1F2937;
        stroke-width: 1.5;
      }

      .title-text {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 21px;
        font-weight: 900;
        fill: #0F172A;
      }

      .lane-text {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 15px;
        font-weight: 900;
        fill: #111827;
      }

      .node-text {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #111827;
      }

      .label-text {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 13px;
        font-weight: 800;
        fill: #111827;
      }

      .start-end {
        fill: #FBCFE8;
        stroke: #831843;
        stroke-width: 2;
      }

      .process-blue {
        fill: #BFDBFE;
        stroke: #1D4ED8;
        stroke-width: 2;
      }

      .process-green {
        fill: #BBF7D0;
        stroke: #15803D;
        stroke-width: 2;
      }

      .process-yellow {
        fill: #FDE68A;
        stroke: #B45309;
        stroke-width: 2;
      }

      .process-purple {
        fill: #E9D5FF;
        stroke: #7E22CE;
        stroke-width: 2;
      }

      .decision {
        fill: #FED7AA;
        stroke: #C2410C;
        stroke-width: 2;
      }

      .flow {
        stroke: #111827;
        stroke-width: 1.7;
        fill: none;
        marker-end: url(#arrow);
      }

      .flow-dashed {
        stroke: #64748B;
        stroke-width: 1.6;
        fill: none;
        stroke-dasharray: 6 5;
        marker-end: url(#arrowGray);
      }

      .note {
        fill: #FFFFFF;
        stroke: #CBD5E1;
        stroke-width: 1.4;
      }

      .note-text {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #475569;
      }
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>

    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="850" class="bg"/>

  <!-- Main container -->
  <rect x="80" y="60" width="940" height="730" rx="4" class="outer"/>

  <!-- Title row -->
  <rect x="80" y="60" width="940" height="38" class="title-row"/>
  <text x="550" y="85" text-anchor="middle" class="title-text">客服處理流程泳道圖</text>

  <!-- Lane header row -->
  <rect x="80" y="98" width="235" height="42" class="lane-customer lane-header"/>
  <rect x="315" y="98" width="235" height="42" class="lane-service lane-header"/>
  <rect x="550" y="98" width="235" height="42" class="lane-tech lane-header"/>
  <rect x="785" y="98" width="235" height="42" class="lane-qa lane-header"/>

  <text x="197.5" y="125" text-anchor="middle" class="lane-text">客戶</text>
  <text x="432.5" y="125" text-anchor="middle" class="lane-text">客服人員</text>
  <text x="667.5" y="125" text-anchor="middle" class="lane-text">技術 / 相關部門</text>
  <text x="902.5" y="125" text-anchor="middle" class="lane-text">主管 / 品保</text>

  <!-- Lane backgrounds -->
  <rect x="80" y="140" width="235" height="650" class="lane-bg-customer"/>
  <rect x="315" y="140" width="235" height="650" class="lane-bg-service"/>
  <rect x="550" y="140" width="235" height="650" class="lane-bg-tech"/>
  <rect x="785" y="140" width="235" height="650" class="lane-bg-qa"/>

  <!-- Lane vertical lines -->
  <line x1="315" y1="98" x2="315" y2="790" class="lane-line"/>
  <line x1="550" y1="98" x2="550" y2="790" class="lane-line"/>
  <line x1="785" y1="98" x2="785" y2="790" class="lane-line"/>

  <!-- Header bottom line -->
  <line x1="80" y1="140" x2="1020" y2="140" class="lane-line"/>

  <!-- ================= 客戶泳道 ================= -->

  <!-- Start -->
  <rect x="135" y="170" width="125" height="52" rx="26" class="start-end" filter="url(#softShadow)"/>
  <text x="197.5" y="202" text-anchor="middle" class="node-text">開始</text>

  <!-- Customer submit issue -->
  <rect x="125" y="260" width="145" height="58" rx="8" class="process-yellow" filter="url(#softShadow)"/>
  <text x="197.5" y="284" text-anchor="middle" class="node-text">提出問題</text>
  <text x="197.5" y="304" text-anchor="middle" class="node-text">或服務需求</text>

  <!-- Customer confirm -->
  <polygon points="197.5,570 270,610 197.5,650 125,610" class="decision" filter="url(#softShadow)"/>
  <text x="197.5" y="604" text-anchor="middle" class="node-text">問題是否</text>
  <text x="197.5" y="624" text-anchor="middle" class="node-text">已解決？</text>

  <!-- Customer end -->
  <rect x="135" y="710" width="125" height="52" rx="26" class="start-end" filter="url(#softShadow)"/>
  <text x="197.5" y="742" text-anchor="middle" class="node-text">結束</text>

  <!-- Customer internal flows -->
  <line x1="197.5" y1="222" x2="197.5" y2="260" class="flow"/>
  <line x1="197.5" y1="650" x2="197.5" y2="710" class="flow"/>
  <text x="212" y="690" class="label-text">是</text>

  <!-- ================= 客服泳道 ================= -->

  <!-- Create ticket -->
  <rect x="360" y="260" width="145" height="58" rx="8" class="process-blue" filter="url(#softShadow)"/>
  <text x="432.5" y="284" text-anchor="middle" class="node-text">建立客服工單</text>
  <text x="432.5" y="304" text-anchor="middle" class="node-text">記錄需求</text>

  <!-- Initial check -->
  <rect x="360" y="365" width="145" height="58" rx="8" class="process-blue" filter="url(#softShadow)"/>
  <text x="432.5" y="389" text-anchor="middle" class="node-text">初步確認</text>
  <text x="432.5" y="409" text-anchor="middle" class="node-text">問題類型</text>

  <!-- Decision can solve -->
  <polygon points="432.5,465 505,505 432.5,545 360,505" class="decision" filter="url(#softShadow)"/>
  <text x="432.5" y="499" text-anchor="middle" class="node-text">客服可</text>
  <text x="432.5" y="519" text-anchor="middle" class="node-text">直接處理？</text>

  <!-- Reply customer -->
  <rect x="360" y="590" width="145" height="58" rx="8" class="process-blue" filter="url(#softShadow)"/>
  <text x="432.5" y="614" text-anchor="middle" class="node-text">回覆客戶</text>
  <text x="432.5" y="634" text-anchor="middle" class="node-text">提供解決方案</text>

  <!-- Close ticket -->
  <rect x="360" y="710" width="145" height="52" rx="8" class="process-blue" filter="url(#softShadow)"/>
  <text x="432.5" y="742" text-anchor="middle" class="node-text">結案歸檔</text>

  <!-- Service internal flows -->
  <line x1="432.5" y1="318" x2="432.5" y2="365" class="flow"/>
  <line x1="432.5" y1="423" x2="432.5" y2="465" class="flow"/>
  <line x1="432.5" y1="545" x2="432.5" y2="590" class="flow"/>
  <text x="447" y="572" class="label-text">是</text>

  <!-- ================= 技術 / 相關部門泳道 ================= -->

  <!-- Assign department -->
  <rect x="595" y="365" width="145" height="58" rx="8" class="process-green" filter="url(#softShadow)"/>
  <text x="667.5" y="389" text-anchor="middle" class="node-text">轉派相關部門</text>
  <text x="667.5" y="409" text-anchor="middle" class="node-text">分析原因</text>

  <!-- Fix issue -->
  <rect x="595" y="495" width="145" height="58" rx="8" class="process-green" filter="url(#softShadow)"/>
  <text x="667.5" y="519" text-anchor="middle" class="node-text">處理問題</text>
  <text x="667.5" y="539" text-anchor="middle" class="node-text">或提供方案</text>

  <!-- Notify service -->
  <rect x="595" y="590" width="145" height="58" rx="8" class="process-green" filter="url(#softShadow)"/>
  <text x="667.5" y="614" text-anchor="middle" class="node-text">回報處理結果</text>
  <text x="667.5" y="634" text-anchor="middle" class="node-text">給客服</text>

  <!-- Tech internal flows -->
  <line x1="667.5" y1="423" x2="667.5" y2="495" class="flow"/>
  <line x1="667.5" y1="553" x2="667.5" y2="590" class="flow"/>

  <!-- ================= 主管 / 品保泳道 ================= -->

  <!-- Escalate -->
  <rect x="830" y="465" width="145" height="58" rx="8" class="process-purple" filter="url(#softShadow)"/>
  <text x="902.5" y="489" text-anchor="middle" class="node-text">升級處理</text>
  <text x="902.5" y="509" text-anchor="middle" class="node-text">主管協調</text>

  <!-- QA review -->
  <rect x="830" y="590" width="145" height="58" rx="8" class="process-purple" filter="url(#softShadow)"/>
  <text x="902.5" y="614" text-anchor="middle" class="node-text">滿意度追蹤</text>
  <text x="902.5" y="634" text-anchor="middle" class="node-text">與品質檢核</text>

  <!-- QA internal flow -->
  <line x1="902.5" y1="523" x2="902.5" y2="590" class="flow"/>

  <!-- ================= Cross lane flows ================= -->

  <!-- Customer submit to service create ticket -->
  <line x1="270" y1="289" x2="360" y2="289" class="flow"/>

  <!-- Service cannot solve to tech -->
  <path d="M505 505 L540 505 L540 394 L595 394" class="flow"/>
  <text x="520" y="492" class="label-text">否</text>

  <!-- Tech notify to service reply -->
  <path d="M595 619 L505 619" class="flow"/>

  <!-- Service reply to customer confirm -->
  <line x1="360" y1="619" x2="270" y2="610" class="flow"/>

  <!-- Customer confirms no, return to service -->
  <path d="M125 610 L100 610 L100 340 L360 340 L360 394" class="flow"/>
  <text x="112" y="595" class="label-text">否</text>

  <!-- Customer yes to service close ticket -->
  <path d="M270 610 L310 610 L310 736 L360 736" class="flow"/>

  <!-- Close ticket to QA tracking -->
  <path d="M505 736 L790 736 L790 619 L830 619" class="flow-dashed"/>

  <!-- Escalation from tech issue to supervisor -->
  <path d="M740 524 L805 524 L805 494 L830 494" class="flow"/>
  <text x="760" y="512" class="label-text">重大 / 複雜</text>

  <!-- Supervisor back to tech -->
  <path d="M830 494 L790 494 L790 560 L740 560" class="flow-dashed"/>

  <!-- ================= Notes ================= -->
  <rect x="610" y="700" width="345" height="58" rx="8" class="note"/>
  <text x="630" y="724" class="note-text">備註：虛線代表追蹤、回饋或協調流程。</text>
  <text x="630" y="746" class="note-text">若客戶未滿意，工單會回到客服重新確認需求。</text>
</svg>