<svg width="1400" height="660" viewBox="0 0 1400 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg {
        fill: #ffffff;
      }

      .line {
        stroke: #2f2f2f;
        stroke-width: 2;
        fill: none;
        stroke-linecap: square;
      }

      .manager-box {
        fill: #222222;
        stroke: #222222;
        stroke-width: 2;
      }

      .dept-box {
        stroke-width: 2;
      }

      .dept-a {
        fill: #FFE4E6;
        stroke: #FB7185;
      }

      .dept-b {
        fill: #FFEDD5;
        stroke: #FB923C;
      }

      .dept-c {
        fill: #DCFCE7;
        stroke: #22C55E;
      }

      .dept-d {
        fill: #DBEAFE;
        stroke: #3B82F6;
      }

      .dept-e {
        fill: #F3E8FF;
        stroke: #A855F7;
      }

      .member-tag {
        fill: #ffffff;
        stroke: #d7d7d7;
        stroke-width: 1.5;
      }

      .manager-text {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 18px;
        font-weight: 800;
        fill: #ffffff;
      }

      .dept-text {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 17px;
        font-weight: 800;
        fill: #111111;
      }

      .member-text {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 15px;
        font-weight: 600;
        fill: #333333;
      }

      .small-label {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #666666;
      }

      .title {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 30px;
        font-weight: 900;
        fill: #222222;
      }

      .subtitle {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #777777;
      }
    </style>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
