<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg {
        fill: #ffffff;
      }

      .panel {
        fill: #ffffff;
        stroke: #d8d8d8;
        stroke-width: 2;
      }

      .title {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 22px;
        font-weight: 800;
        fill: #333333;
      }

      .item {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #777777;
      }

      .main-title {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 34px;
        font-weight: 900;
        fill: #222222;
      }

      .subtitle {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #888888;
      }

      .note {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 13px;
        fill: #aaaaaa;
      }

      .accent-blue {
        fill: #EAF4FF;
      }

      .accent-orange {
        fill: #FFF3E8;
      }

      .accent-green {
        fill: #ECFDF3;
      }

      .accent-purple {
        fill: #F5F0FF;
      }

      .accent-pink {
        fill: #FFF0F5;
      }

      .accent-yellow {
        fill: #FFF9E6;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" class="bg"/>

  <!-- Header -->
  <text x="600" y="48" text-anchor="middle" class="main-title">商業模式畫布分析圖</text>
  <text x="600" y="75" text-anchor="middle" class="subtitle">Business Model Canvas｜用 9 個區塊快速整理你的商業模式</text>

  <!-- Canvas outer area -->
  <rect x="50" y="105" width="1100" height="590" rx="18" fill="#ffffff" stroke="#cfcfcf" stroke-width="2"/>

  <!-- Top main columns -->
  <!-- 重要合作 -->
  <rect x="50" y="105" width="220" height="390" class="panel accent-blue"/>
  <text x="75" y="145" class="title">重要合作</text>
  <text x="75" y="185" class="item">・輸入內容</text>
  <text x="75" y="220" class="item">・輸入內容</text>
  <text x="75" y="255" class="item">・輸入內容</text>
  <text x="75" y="290" class="item">・輸入內容</text>
  <text x="75" y="325" class="item">・輸入內容</text>
  <text x="75" y="360" class="item">・輸入內容</text>

  <!-- 關鍵業務 / 核心資源 column -->
  <rect x="270" y="105" width="220" height="195" class="panel accent-orange"/>
  <text x="295" y="145" class="title">關鍵業務</text>
  <text x="295" y="185" class="item">・輸入內容</text>
  <text x="295" y="220" class="item">・輸入內容</text>
  <text x="295" y="255" class="item">・輸入內容</text>

  <rect x="270" y="300" width="220" height="195" class="panel accent-yellow"/>
  <text x="295" y="340" class="title">核心資源</text>
  <text x="295" y="380" class="item">・輸入內容</text>
  <text x="295" y="415" class="item">・輸入內容</text>
  <text x="295" y="450" class="item">・輸入內容</text>

  <!-- 價值服務 -->
  <rect x="490" y="105" width="220" height="390" class="panel accent-green"/>
  <text x="515" y="145" class="title">價值服務</text>
  <text x="515" y="185" class="item">・輸入內容</text>
  <text x="515" y="220" class="item">・輸入內容</text>
  <text x="515" y="255" class="item">・輸入內容</text>
  <text x="515" y="290" class="item">・輸入內容</text>
  <text x="515" y="325" class="item">・輸入內容</text>
  <text x="515" y="360" class="item">・輸入內容</text>

  <!-- 客戶關係 / 管道通路 column -->
  <rect x="710" y="105" width="220" height="195" class="panel accent-purple"/>
  <text x="735" y="145" class="title">客戶關係</text>
  <text x="735" y="185" class="item">・輸入內容</text>
  <text x="735" y="220" class="item">・輸入內容</text>
  <text x="735" y="255" class="item">・輸入內容</text>

  <rect x="710" y="300" width="220" height="195" class="panel accent-pink"/>
  <text x="735" y="340" class="title">管道通路</text>
  <text x="735" y="380" class="item">・輸入內容</text>
  <text x="735" y="415" class="item">・輸入內容</text>
  <text x="735" y="450" class="item">・輸入內容</text>

  <!-- 客戶群體 -->
  <rect x="930" y="105" width="220" height="390" class="panel accent-blue"/>
  <text x="955" y="145" class="title">客戶群體</text>
  <text x="955" y="185" class="item">・輸入內容</text>
  <text x="955" y="220" class="item">・輸入內容</text>
  <text x="955" y="255" class="item">・輸入內容</text>
  <text x="955" y="290" class="item">・輸入內容</text>
  <text x="955" y="325" class="item">・輸入內容</text>
  <text x="955" y="360" class="item">・輸入內容</text>

  <!-- Bottom row -->
  <rect x="50" y="495" width="550" height="200" class="panel"/>
  <text x="75" y="535" class="title">成本結構</text>
  <text x="75" y="575" class="item">・輸入內容</text>
  <text x="75" y="610" class="item">・輸入內容</text>
  <text x="75" y="645" class="item">・輸入內容</text>

  <rect x="600" y="495" width="550" height="200" class="panel"/>
  <text x="625" y="535" class="title">收入來源</text>
  <text x="625" y="575" class="item">・輸入內容</text>
  <text x="625" y="610" class="item">・輸入內容</text>
  <text x="625" y="645" class="item">・輸入內容</text>

  <!-- Footer note -->
  <text x="600" y="730" text-anchor="middle" class="note">可依照產業、品牌、課程、服務或創業計畫填入內容</text>
</svg>