  <path d="M690 455 C605 430 585 260 490 260" class="line cyan"/>
  <rect x="350" y="239" width="190" height="42" rx="8" class="topic-box box-cyan" filter="url(#softShadow)"/>
  <text x="445" y="266" text-anchor="middle" class="topic-text">2. 專案範疇管理</text>
  <path d="M350 260 C310 225 270 220 190 215" class="thin-line cyan"/>
  <path d="M350 260 C310 255 270 255 190 255" class="thin-line cyan"/>
  <path d="M350 260 C310 295 270 300 190 305" class="thin-line cyan"/>
  <path d="M350 260 C310 340 270 350 190 358" class="thin-line cyan"/>
