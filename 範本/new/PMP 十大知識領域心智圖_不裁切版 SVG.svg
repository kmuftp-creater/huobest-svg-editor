  <text x="180" y="740" text-anchor="end" class="item-text">管理品質</text>
  <text x="180" y="807" text-anchor="end" class="item-text">控制品質</text>

  <!-- ================= RIGHT SIDE ================= -->

  <!-- 6 Resource -->
  <path d="M910 445 C1000 410 995 105 1110 105" class="line red"/>
  <rect x="1060" y="84" width="210" height="42" rx="8" class="topic-box box-red" filter="url(#softShadow)"/>
  <text x="1165" y="111" text-anchor="middle" class="topic-text">6. 專案資源管理</text>
  <path d="M1270 105 C1310 60 1335 55 1410 50" class="thin-line red"/>
  <path d="M1270 105 C1310 95 1335 95 1410 95" class="thin-line red"/>
  <path d="M1270 105 C1310 135 1335 140 1410 145" class="thin-line red"/>
  <path d="M1270 105 C1310 180 1335 190 1410 198" class="thin-line red"/>
