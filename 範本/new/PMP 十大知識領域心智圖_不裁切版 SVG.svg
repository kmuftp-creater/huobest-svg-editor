  <text x="180" y="585" text-anchor="end" class="item-text">估算成本與制定預算</text>
  <text x="180" y="635" text-anchor="end" class="item-text">控制成本</text>

  <!-- 5 Quality -->
  <path d="M690 505 C610 600 590 735 490 735" class="line orange"/>
  <rect x="350" y="714" width="190" height="42" rx="8" class="topic-box box-orange" filter="url(#softShadow)"/>
  <text x="445" y="741" text-anchor="middle" class="topic-text">5. 專案品質管理</text>
  <path d="M350 735 C310 690 270 685 190 680" class="thin-line orange"/>
  <path d="M350 735 C310 735 270 735 190 735" class="thin-line orange"/>
  <path d="M350 735 C310 785 270 795 190 802" class="thin-line orange"/>
