  <text x="180" y="425" text-anchor="end" class="item-text">估算活動期間</text>
  <text x="180" y="470" text-anchor="end" class="item-text">制定時程</text>
  <text x="180" y="523" text-anchor="end" class="item-text">控制時程</text>

  <!-- 4 Cost -->
  <path d="M690 490 C600 520 585 580 490 580" class="line yellow"/>
  <rect x="350" y="559" width="190" height="42" rx="8" class="topic-box box-yellow" filter="url(#softShadow)"/>
  <text x="445" y="586" text-anchor="middle" class="topic-text">4. 專案成本管理</text>
  <path d="M350 580 C310 550 270 545 190 540" class="thin-line yellow"/>
  <path d="M350 580 C310 580 270 580 190 580" class="thin-line yellow"/>
  <path d="M350 580 C310 620 270 625 190 630" class="thin-line yellow"/>
