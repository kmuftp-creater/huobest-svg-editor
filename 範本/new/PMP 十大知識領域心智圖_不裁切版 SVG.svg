  <text x="1420" y="265" class="item-text">管理溝通</text>
  <text x="1420" y="320" class="item-text">監督溝通</text>

  <!-- 8 Risk -->
  <path d="M910 470 C1000 470 1015 420 1110 420" class="line purple"/>
  <rect x="1060" y="399" width="210" height="42" rx="8" class="topic-box box-purple" filter="url(#softShadow)"/>
  <text x="1165" y="426" text-anchor="middle" class="topic-text">8. 專案風險管理</text>
  <path d="M1270 420 C1310 375 1335 370 1410 365" class="thin-line purple"/>
  <path d="M1270 420 C1310 405 1335 405 1410 405" class="thin-line purple"/>
  <path d="M1270 420 C1310 445 1335 448 1410 452" class="thin-line purple"/>
  <path d="M1270 420 C1310 490 1335 500 1410 508" class="thin-line purple"/>
  <text x="1420" y="370" class="item-text">規劃風險管理</text>
  <text x="1420" y="410" class="item-text">辨識與分析風險</text>
  <text x="1420" y="457" class="item-text">規劃與執行風險應對</text>
  <text x="1420" y="513" class="item-text">監督風險</text>

  <!-- 9 Procurement -->
  <path d="M910 490 C1000 520 1015 580 1110 580" class="line lime"/>
  <rect x="1060" y="559" width="230" height="42" rx="8" class="topic-box box-lime" filter="url(#softShadow)"/>
  <text x="1175" y="586" text-anchor="middle" class="topic-text">9. 專案採購管理</text>
  <path d="M1290 580 C1330 545 1350 540 1410 535" class="thin-line lime"/>
  <path d="M1290 580 C1330 580 1350 580 1410 580" class="thin-line lime"/>
  <path d="M1290 580 C1330 625 1350 630 1410 635" class="thin-line lime"/>
  <text x="1420" y="540" class="item-text">規劃採購管理</text>
  <text x="1420" y="585" class="item-text">執行採購</text>
  <text x="1420" y="640" class="item-text">控制採購</text>

  <!-- 10 Stakeholder -->
  <path d="M910 505 C990 600 1010 735 1110 735" class="line indigo"/>
  <rect x="1030" y="714" width="290" height="42" rx="8" class="topic-box box-indigo" filter="url(#softShadow)"/>
  <text x="1175" y="741" text-anchor="middle" class="topic-text">10. 專案利害關係人管理</text>
  <path d="M1320 735 C1350 690 1370 685 1410 680" class="thin-line indigo"/>
  <path d="M1320 735 C1350 735 1370 735 1410 735" class="thin-line indigo"/>
  <path d="M1320 735 C1350 785 1370 795 1410 802" class="thin-line indigo"/>
  <text x="1420" y="685" class="item-text">辨識利害關係人</text>
  <text x="1420" y="740" class="item-text">規劃與管理參與</text>
  <text x="1420" y="807" class="item-text">監督利害關係人參與</text>

  <!-- Footer note -->
  <rect x="555" y="880" width="490" height="42" rx="10" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="800" y="906" text-anchor="middle" class="legend">
    PMP 十大知識領域：整合、範疇、時程、成本、品質、資源、溝通、風險、採購、利害關係人
  </text>
</svg>