  <text x="180" y="260" text-anchor="end" class="item-text">蒐集需求</text>
  <text x="180" y="310" text-anchor="end" class="item-text">定義範疇與建立 WBS</text>
  <text x="180" y="363" text-anchor="end" class="item-text">確認範疇與控制範疇</text>

