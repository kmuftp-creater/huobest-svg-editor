<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg {
        fill: #ffffff;
      }

      .center-box {
        fill: #3B82F6;
        stroke: none;
      }

      .center-title {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 30px;
        font-weight: 900;
        fill: #ffffff;
      }

      .center-sub {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 16px;
        font-weight: 700;
        fill: #DBEAFE;
      }

      .topic-box {
        stroke: none;
      }

      .topic-text {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 17px;
        font-weight: 900;
        fill: #ffffff;
      }

      .item-text {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #1F2937;
      }

      .line {
        fill: none;
        stroke-width: 3.2;
        stroke-linecap: round;
      }

      .thin-line {
        fill: none;
        stroke-width: 2.1;
        stroke-linecap: round;
      }

      .blue { stroke: #2563EB; }
      .cyan { stroke: #06B6D4; }
      .green { stroke: #22C55E; }
      .lime { stroke: #A3E635; }
      .yellow { stroke: #F59E0B; }
      .orange { stroke: #F97316; }
      .red { stroke: #EF4444; }
      .pink { stroke: #EC4899; }
      .purple { stroke: #A855F7; }
      .indigo { stroke: #6366F1; }

      .box-blue { fill: #2563EB; }
      .box-cyan { fill: #06B6D4; }
      .box-green { fill: #22C55E; }
      .box-lime { fill: #84CC16; }
      .box-yellow { fill: #F59E0B; }
      .box-orange { fill: #F97316; }
      .box-red { fill: #EF4444; }
      .box-pink { fill: #EC4899; }
      .box-purple { fill: #A855F7; }
      .box-indigo { fill: #6366F1; }

      .legend {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #4B5563;
      }
    </style>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="980" class="bg"/>

  <!-- Center -->
  <rect x="690" y="430" width="220" height="84" rx="12" class="center-box" filter="url(#softShadow)"/>
  <text x="800" y="466" text-anchor="middle" class="center-title">PMP 專案管理</text>
  <text x="800" y="494" text-anchor="middle" class="center-sub">十大知識領域</text>

  <!-- ================= LEFT SIDE ================= -->

  <!-- 1 Integration -->
  <path d="M690 445 C600 410 605 105 490 105" class="line blue"/>
  <rect x="350" y="84" width="190" height="42" rx="8" class="topic-box box-blue" filter="url(#softShadow)"/>
  <text x="445" y="111" text-anchor="middle" class="topic-text">1. 專案整合管理</text>
  <path d="M350 105 C310 60 270 55 190 50" class="thin-line blue"/>
  <path d="M350 105 C310 95 270 95 190 95" class="thin-line blue"/>
  <path d="M350 105 C310 135 270 138 190 142" class="thin-line blue"/>
  <path d="M350 105 C310 180 270 188 190 195" class="thin-line blue"/>
  <text x="180" y="55" text-anchor="end" class="item-text">制定專案章程</text>
  <text x="180" y="100" text-anchor="end" class="item-text">制定專案管理計畫</text>
  <text x="180" y="147" text-anchor="end" class="item-text">指導與管理專案工作</text>
  <text x="180" y="200" text-anchor="end" class="item-text">監控專案與整體變更控制</text>

