  <text x="1420" y="100" class="item-text">估算活動資源</text>
  <text x="1420" y="150" class="item-text">取得、發展與管理團隊</text>
  <text x="1420" y="203" class="item-text">控制資源</text>

  <!-- 7 Communication -->
  <path d="M910 455 C995 430 1015 260 1110 260" class="line pink"/>
  <rect x="1060" y="239" width="230" height="42" rx="8" class="topic-box box-pink" filter="url(#softShadow)"/>
  <text x="1175" y="266" text-anchor="middle" class="topic-text">7. 專案溝通管理</text>
  <path d="M1290 260 C1330 225 1350 220 1410 215" class="thin-line pink"/>
  <path d="M1290 260 C1330 260 1350 260 1410 260" class="thin-line pink"/>
  <path d="M1290 260 C1330 305 1350 310 1410 315" class="thin-line pink"/>
