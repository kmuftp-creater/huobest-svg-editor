<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg {
        fill: #ffffff;
      }

      .line {
        stroke: #777777;
        stroke-width: 1.8;
        fill: none;
      }

      .dash {
        stroke: #cfcfcf;
        stroke-width: 1.5;
        stroke-dasharray: 5 5;
      }

      .box {
        stroke: #6f6f6f;
        stroke-width: 1.8;
      }

      .manager {
        fill: #E7D2DF;
      }

      .assistant {
        fill: #DDEED8;
      }

      .member {
        fill: #F4CCCC;
      }

      .department {
        fill: #FFF2BF;
      }

      .team {
        fill: #D6E2F3;
      }

      .text {
        font-family: Arial, "Noto Sans TC", sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #111111;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" class="bg"/>

  <!-- Center dashed line -->
  <line x1="600" y1="0" x2="600" y2="560" class="dash"/>

  <!-- Top boxes -->
  <rect x="532" y="15" width="136" height="52" class="box manager"/>
  <text x="600" y="47" text-anchor="middle" class="text">專案經理</text>

  <rect x="532" y="110" width="136" height="52" class="box assistant"/>
  <text x="600" y="142" text-anchor="middle" class="text">專案副經理</text>

  <!-- Top vertical connection -->
  <line x1="600" y1="67" x2="600" y2="110" class="line"/>

  <!-- Member level connector -->
  <line x1="600" y1="162" x2="600" y2="195" class="line"/>
  <line x1="235" y1="195" x2="965" y2="195" class="line"/>

  <!-- Member vertical drops -->
  <line x1="235" y1="195" x2="235" y2="225" class="line"/>
  <line x1="417" y1="195" x2="417" y2="225" class="line"/>
  <line x1="600" y1="195" x2="600" y2="225" class="line"/>
  <line x1="782" y1="195" x2="782" y2="225" class="line"/>
  <line x1="965" y1="195" x2="965" y2="225" class="line"/>

  <!-- Members -->
  <rect x="185" y="225" width="100" height="52" class="box member"/>
  <text x="235" y="257" text-anchor="middle" class="text">成員 1</text>

  <rect x="367" y="225" width="100" height="52" class="box member"/>
  <text x="417" y="257" text-anchor="middle" class="text">成員 2</text>

  <rect x="550" y="225" width="100" height="52" class="box member"/>
  <text x="600" y="257" text-anchor="middle" class="text">成員 3</text>

  <rect x="732" y="225" width="100" height="52" class="box member"/>
  <text x="782" y="257" text-anchor="middle" class="text">成員 4</text>

  <rect x="915" y="225" width="100" height="52" class="box member"/>
  <text x="965" y="257" text-anchor="middle" class="text">成員 5</text>

  <!-- Department level connector -->
  <line x1="600" y1="277" x2="600" y2="320" class="line"/>
  <line x1="235" y1="320" x2="965" y2="320" class="line"/>

  <line x1="235" y1="320" x2="235" y2="365" class="line"/>
  <line x1="600" y1="320" x2="600" y2="365" class="line"/>
  <line x1="965" y1="320" x2="965" y2="365" class="line"/>

  <!-- Departments -->
  <rect x="147" y="365" width="176" height="72" class="box department"/>
  <text x="235" y="407" text-anchor="middle" class="text">部門 A</text>

  <rect x="512" y="365" width="176" height="72" class="box department"/>
  <text x="600" y="407" text-anchor="middle" class="text">部門 B</text>

  <rect x="877" y="365" width="176" height="72" class="box department"/>
  <text x="965" y="407" text-anchor="middle" class="text">部門 C</text>

  <!-- Team connectors A -->
  <line x1="235" y1="437" x2="235" y2="462" class="line"/>
  <line x1="95" y1="462" x2="375" y2="462" class="line"/>
  <line x1="95" y1="462" x2="95" y2="487" class="line"/>
  <line x1="235" y1="462" x2="235" y2="487" class="line"/>
  <line x1="375" y1="462" x2="375" y2="487" class="line"/>

  <!-- Team A boxes -->
  <rect x="45" y="487" width="100" height="52" class="box team"/>
  <text x="95" y="519" text-anchor="middle" class="text">團隊 1</text>

  <rect x="185" y="487" width="100" height="52" class="box team"/>
  <text x="235" y="519" text-anchor="middle" class="text">團隊 2</text>

  <rect x="325" y="487" width="100" height="52" class="box team"/>
  <text x="375" y="519" text-anchor="middle" class="text">團隊 3</text>

  <!-- Team connectors B -->
  <line x1="600" y1="437" x2="600" y2="462" class="line"/>
  <line x1="527" y1="462" x2="673" y2="462" class="line"/>
  <line x1="527" y1="462" x2="527" y2="487" class="line"/>
  <line x1="673" y1="462" x2="673" y2="487" class="line"/>

  <!-- Team B boxes -->
  <rect x="477" y="487" width="100" height="52" class="box team"/>
  <text x="527" y="519" text-anchor="middle" class="text">團隊 1</text>

  <rect x="623" y="487" width="100" height="52" class="box team"/>
  <text x="673" y="519" text-anchor="middle" class="text">團隊 2</text>

  <!-- Team connectors C -->
  <line x1="965" y1="437" x2="965" y2="462" class="line"/>
  <line x1="825" y1="462" x2="1105" y2="462" class="line"/>
  <line x1="825" y1="462" x2="825" y2="487" class="line"/>
  <line x1="965" y1="462" x2="965" y2="487" class="line"/>
  <line x1="1105" y1="462" x2="1105" y2="487" class="line"/>

  <!-- Team C boxes -->
  <rect x="775" y="487" width="100" height="52" class="box team"/>
  <text x="825" y="519" text-anchor="middle" class="text">團隊 1</text>

  <rect x="915" y="487" width="100" height="52" class="box team"/>
  <text x="965" y="519" text-anchor="middle" class="text">團隊 2</text>

  <rect x="1055" y="487" width="100" height="52" class="box team"/>
  <text x="1105" y="519" text-anchor="middle" class="text">團隊 3</text>
</svg>